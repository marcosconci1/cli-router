name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Probe bubblewrap sandbox
        run: |
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net -- true && echo BWRAP_OK || echo BWRAP_FAIL_rc=$?
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net -- git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel || true
      - run: uv sync --locked
      - run: uv run pytest -q
