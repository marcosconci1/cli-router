name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Provide dev-host fixtures (CLI stubs and home state dirs)
        run: |
          for c in codex claude kimi agy opencode ai-memory; do
            printf '#!/bin/sh\nexit 0\n' | sudo tee "/usr/bin/$c" >/dev/null
            sudo chmod +x "/usr/bin/$c"
          done
          mkdir -p ~/.codex ~/.kimi-code ~/.claude
      - run: uv sync --locked
      - run: uv run pytest -q
