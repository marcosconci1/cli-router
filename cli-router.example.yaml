# Copy this file to <hermes-home>/cli-router.yaml, the Hermes home of the active profile.
# For code profiles this is the profile directory under ~/.hermes/profiles/<name>/.
# CLI_ROUTER_CONFIG overrides this path; the plugin-directory file is a legacy fallback.
# This file overrides only the settings specified; absent settings keep their Hermes
# configuration or cli-router default.
cli-router:
  providers:
    codex:
      enabled: true
      excluded_models: []
    claude:
      enabled: true
      excluded_models: []
    kimi:
      enabled: true
      excluded_models: []
    agy:
      enabled: true
      excluded_models: []
    opencode:
      # Opt in to the experimental OpenRouter free fallback.
      enabled: false
      excluded_models: []
  jev: true
  ai-memory: auto
  independent-review: true
  # Concurrent workers across repositories, an integer from 1 to 8.
  max-workers: 2
