<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#ffffff; }
  .card {
    position:absolute; inset:0;
    background:
      radial-gradient(820px 480px at 30% 125%, rgba(243,226,205,.9) 0%, rgba(0,0,0,0) 62%),
      radial-gradient(560px 380px at 82% -18%, rgba(238,240,242,.9) 0%, rgba(0,0,0,0) 55%),
      #f7f5f1;
  }
  .grain {
    position:absolute; inset:0; opacity:.05; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='1'/></svg>");
    background-size:160px 160px;
  }
  .lockup { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:44px; }
  .mark { width:250px; height:250px; }
  .name { font-family:'Inter',sans-serif; font-size:150px; font-weight:700; color:#26292e; letter-spacing:-5px; }
  .tagline { position:absolute; bottom:118px; left:0; right:0; text-align:center; font-family:'JetBrains Mono',monospace; font-size:30px; letter-spacing:2px; color:#8a8579; }
  .bracket { position:absolute; color:#26292e; opacity:.9; }
  .bracket svg { display:block; }
  .tl{ top:64px; left:74px; } .tr{ top:64px; right:74px; }
  .bl{ bottom:64px; left:74px; } .br{ bottom:64px; right:74px; }
</style></head>
<body>
  <div class="card"></div><div class="grain"></div>
  <span class="bracket tl"><svg width="46" height="46" viewBox="0 0 46 46"><path d="M2 44 V6 Q2 2 6 2 H44" fill="none" stroke="#26292e" stroke-width="2.5"/></svg></span>
  <span class="bracket tr"><svg width="46" height="46" viewBox="0 0 46 46"><path d="M2 2 H40 Q44 2 44 6 V44" fill="none" stroke="#26292e" stroke-width="2.5"/></svg></span>
  <span class="bracket bl"><svg width="46" height="46" viewBox="0 0 46 46"><path d="M44 2 V40 Q44 44 40 44 H2" fill="none" stroke="#26292e" stroke-width="2.5"/></svg></span>
  <span class="bracket br"><svg width="46" height="46" viewBox="0 0 46 46"><path d="M44 44 H6 Q2 44 2 40 V2" fill="none" stroke="#26292e" stroke-width="2.5"/></svg></span>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 112 112" fill="none">
      <path d="M8 56 H52" stroke="#26292e" stroke-width="5" stroke-linecap="round"/>
      <path d="M52 56 C 74 56, 84 32, 104 24" stroke="#c9822e" stroke-width="5" stroke-linecap="round"/>
      <path d="M52 56 C 74 56, 84 80, 104 88" stroke="#26292e" stroke-width="5" stroke-dasharray="1 10" stroke-linecap="round" opacity=".5"/>
      <circle cx="8" cy="56" r="6" fill="#26292e"/>
      <circle cx="104" cy="24" r="7" stroke="#c9822e" stroke-width="4.5" fill="#f7f5f1"/>
      <circle cx="104" cy="88" r="6" fill="none" stroke="#26292e" stroke-width="4" opacity=".5"/>
    </svg>
    <div class="name">cli-router</div>
  </div>
  <div class="tagline">sends every task down the open lane</div>
</body></html>
